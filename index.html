<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XC Stream Mobile Pro</title>
    <!-- Bibliotecas para reprodução de canais (.m3u8 e .ts) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <style>
        :root {
            --bg-main: #090b10;
            --bg-card: #161926;
            --bg-header: #11141f;
            --accent: #e50914;
            --accent-hover: #ff1e27;
            --text-main: #ffffff;
            --text-muted: #a3a9c2;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ================= TELA DE LOGIN ================= */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1f243d 0%, #090b10 100%);
            padding: 20px;
        }

        .login-box {
            background: var(--bg-card);
            padding: 35px 25px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-box h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .login-box p.dns-badge {
            font-size: 14px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 16px;
            border-radius: 12px;
            border: 2px solid #2e344e;
            background: #090b10;
            color: #fff;
            font-size: 18px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #login-error {
            color: #ff5252;
            font-size: 15px;
            margin-top: 15px;
            min-height: 22px;
            font-weight: 600;
        }

        /* ================= TELA PRINCIPAL ================= */
        #app-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        /* TOPO: BUSCA E BOTÕES */
        header {
            background: var(--bg-header);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        #search-input {
            flex: 1;
            height: 50px;
            padding: 0 16px;
            border-radius: 12px;
            border: 2px solid #2e344e;
            background: var(--bg-main);
            color: #fff;
            font-size: 17px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--accent);
        }

        .icon-btn {
            background: #252a40;
            color: #fff;
            border: 1px solid var(--border-color);
            height: 50px;
            padding: 0 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* PAINEL GIGANTE DE CONTROLE DE GRUPOS */
        .category-selector-bar {
            background: var(--bg-header);
            padding: 10px 12px 12px 12px;
            border-bottom: 2px solid #1f2437;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-open-categories {
            width: 100%;
            min-height: 68px;
            background: linear-gradient(135deg, #252b42 0%, #171b2b 100%);
            border: 2px solid var(--accent);
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .btn-open-categories:active {
            transform: scale(0.98);
            background: #2c334f;
        }

        .cat-btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
        }

        .cat-btn-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .cat-btn-texts {
            text-align: left;
            overflow: hidden;
            flex: 1;
        }

        .cat-btn-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff6b72;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .cat-btn-current {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .cat-btn-arrow {
            background: var(--accent);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* BOTÕES DE AVANÇO RÁPIDO DE GRUPO */
        .quick-cat-nav {
            display: flex;
            gap: 10px;
        }

        .btn-step-cat {
            flex: 1;
            height: 46px;
            background: #1d2236;
            border: 1px solid #343b59;
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-step-cat:active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* PLAYER DE VÍDEO FIXO */
        #player-wrapper {
            background: #000;
            width: 100%;
            display: none;
            flex-direction: column;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0;
        }

        video {
            width: 100%;
            max-height: 35vh;
            background: #000;
        }

        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #141724;
            gap: 8px;
            flex-wrap: wrap;
        }

        #now-playing {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-actions {
            display: flex;
            gap: 8px;
        }

        .player-actions button {
            background: #2b3048;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .player-actions button.btn-close-player {
            background: var(--accent);
        }

        /* ÁREA DE CONTEÚDO (CANAIS / FILMES) */
        #content-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* MODO LISTA (BOTÕES LARGOS E ALTOS PARA SMARTPHONE) */
        .view-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .view-list .item-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            min-height: 82px;
        }

        .view-list .item-card:active {
            background: #252a40;
            border-color: var(--accent);
        }

        .view-list .item-card img {
            width: 68px;
            height: 58px;
            object-fit: contain;
            border-radius: 10px;
            background: #090b10;
            flex-shrink: 0;
            padding: 4px;
        }

        .view-list .item-card .title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            text-align: left;
            flex: 1;
        }

        .play-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(229, 9, 20, 0.2);
            border: 2px solid var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* MODO GRADE (2 COLUNAS GRANDES NO CELULAR) */
        .view-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .view-grid .play-badge {
            display: none;
        }

        .view-grid .item-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid var(--border-color);
            cursor: pointer;
            text-align: center;
        }

        .view-grid .item-card:active {
            border-color: var(--accent);
        }

        .view-grid .item-card img {
            width: 100%;
            height: 165px;
            object-fit: contain;
            border-radius: 10px;
            background: #090b10;
            margin-bottom: 10px;
        }

        .view-grid .item-card .title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        /* ================= MODAL TELA CHEIA DE GRUPOS (BOTÕES GIGANTES) ================= */
        #category-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090b10;
            z-index: 9999;
            flex-direction: column;
        }

        .modal-header {
            background: var(--bg-header);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #23283e;
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
        }

        .btn-close-modal {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-search-box {
            padding: 14px 16px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
        }

        #cat-search-input {
            width: 100%;
            height: 54px;
            padding: 0 18px;
            border-radius: 12px;
            border: 2px solid #363d5e;
            background: var(--bg-main);
            color: #fff;
            font-size: 18px;
            outline: none;
        }

        #cat-search-input:focus {
            border-color: var(--accent);
        }

        #categories-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cat-item {
            background: #181c2c;
            min-height: 78px;
            padding: 18px 20px;
            border-radius: 16px;
            cursor: pointer;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid #2b324d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
        }

        .cat-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .cat-item-num {
            background: #2b324d;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: bold;
            min-width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cat-item-title {
            line-height: 1.25;
            text-align: left;
            word-break: break-word;
        }

        .cat-item:active {
            transform: scale(0.98);
        }

        .cat-item.active {
            background: linear-gradient(135deg, #3b0d14 0%, #21131d 100%);
            border: 3px solid var(--accent);
            color: #fff;
        }

        .cat-item.active .cat-item-num {
            background: var(--accent);
            color: #fff;
        }

        .cat-item-check {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            margin-left: 10px;
            flex-shrink: 0;
        }

        /* BARRA DE NAVEGAÇÃO INFERIOR GRANDE */
        .bottom-nav {
            background: var(--bg-header);
            border-top: 2px solid #1f2437;
            display: flex;
            justify-content: space-around;
            padding: 8px 10px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 6px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-btn span.tab-icon {
            font-size: 24px;
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(229, 9, 20, 0.22);
            border-bottom: 4px solid var(--accent);
        }

        .btn-back-series {
            width: 100%;
            padding: 18px;
            background: #2b3048;
            color: #fff;
            border: 2px solid var(--accent);
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h1>XC STREAM</h1>
            <p class="dns-badge">DNS: http://namesec.cc:80</p>
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha">
            </div>
            <button class="btn-login" onclick="fazerLogin()">ENTRAR NA LISTA</button>
            <div id="login-error"></div>
        </div>
    </div>

    <!-- TELA PRINCIPAL -->
    <div id="app-screen">
        <!-- Cabeçalho com Busca e Modo de Exibição -->
        <header>
            <input type="text" id="search-input" placeholder="🔍 Buscar canal ou filme..." oninput="filtrarItens()">
            <button class="icon-btn" id="btn-view-mode" onclick="alternarModoVisao()">⊞ Grade</button>
            <button class="icon-btn" onclick="sair()">Sair</button>
        </header>

        <!-- Painel Grande para Escolher ou Avançar Grupo -->
        <div class="category-selector-bar">
            <button class="btn-open-categories" onclick="abrirModalCategorias()">
                <div class="cat-btn-left">
                    <span class="cat-btn-icon">📂</span>
                    <div class="cat-btn-texts">
                        <span class="cat-btn-label">TOQUE AQUI PARA ESCOLHER O GRUPO:</span>
                        <span class="cat-btn-current" id="current-cat-name">Todos os Grupos</span>
                    </div>
                </div>
                <span class="cat-btn-arrow">GRUPOS ▼</span>
            </button>
            <div class="quick-cat-nav">
                <button class="btn-step-cat" onclick="navegarGrupo(-1)">◀ GRUPO ANTERIOR</button>
                <button class="btn-step-cat" onclick="navegarGrupo(1)">PRÓXIMO GRUPO ▶</button>
            </div>
        </div>

        <!-- Reprodutor de Vídeo -->
        <div id="player-wrapper">
            <video id="video-player" controls autoplay playsinline></video>
            <div class="player-bar">
                <span id="now-playing">Reproduzindo...</span>
                <div class="player-actions">
                    <button onclick="alternarFormatoLive()" id="btn-format">TS</button>
                    <button onclick="abrirPlayerExterno()">VLC / Externo</button>
                    <button class="btn-close-player" onclick="fecharPlayer()">✕</button>
                </div>
            </div>
        </div>

        <!-- Lista de Canais / Filmes -->
        <div id="content-area">
            <div id="items-grid" class="view-list"></div>
        </div>

        <!-- Menu Inferior para Smartphones -->
        <nav class="bottom-nav">
            <button class="tab-btn active" onclick="mudarAba('live', this)">
                <span class="tab-icon">📺</span>
                <span>TV ao Vivo</span>
            </button>
            <button class="tab-btn" onclick="mudarAba('vod', this)">
                <span class="tab-icon">🎬</span>
                <span>Filmes</span>
            </button>
            <button class="tab-btn" onclick="mudarAba('series', this)">
                <span class="tab-icon">🍿</span>
                <span>Séries</span>
            </button>
        </nav>
    </div>

    <!-- MODAL EM TELA CHEIA COM BOTÕES GIGANTES DE GRUPOS -->
    <div id="category-modal">
        <div class="modal-header">
            <h2>📂 Selecionar Grupo</h2>
            <button class="btn-close-modal" onclick="fecharModalCategorias()">Fechar ✕</button>
        </div>
        <div class="modal-search-box">
            <input type="text" id="cat-search-input" placeholder="🔍 Digite o nome do grupo..." oninput="filtrarCategorias()">
        </div>
        <div id="categories-list"></div>
    </div>

    <script>
        // DNS FIXA DO APLICATIVO
        const SERVER_DNS = "http://namesec.cc:80";

        let credenciais = { user: "", pass: "" };
        let abaAtual = "live";
        let listaAtual = [];
        let listaCategorias = [];
        let indiceCategoriaAtual = -1; // -1 = Todos os Grupos
        let categoriaSelecionadaId = "";
        let formatoLive = "ts";
        let modoVisao = "list";
        let ultimoItemTocando = null;
        let urlAtual = "";
        let hlsInstance = null;
        let mpegtsInstance = null;

        window.onload = () => {
            const salvo = localStorage.getItem("iptv_login");
            if (salvo) {
                const dados = JSON.parse(salvo);
                document.getElementById("username").value = dados.user;
                document.getElementById("password").value = dados.pass;
                fazerLogin();
            }
        };

        async function fazerLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorBox = document.getElementById("login-error");

            if (!user || !pass) {
                errorBox.innerText = "Preencha usuário e senha.";
                return;
            }

            errorBox.style.color = "#a3a9c2";
            errorBox.innerText = "Autenticando no servidor...";

            try {
                const url = `${SERVER_DNS}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
                const resp = await fetch(url);
                const data = await resp.json();

                if (data.user_info && data.user_info.auth == 1) {
                    credenciais = { user, pass };
                    localStorage.setItem("iptv_login", JSON.stringify(credenciais));
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("app-screen").style.display = "flex";
                    carregarSecao("live");
                } else {
                    errorBox.style.color = "#ff5252";
                    errorBox.innerText = "Usuário ou senha inválidos.";
                }
            } catch (err) {
                errorBox.style.color = "#ff5252";
                errorBox.innerText = "Erro de conexão com o servidor.";
            }
        }

        function sair() {
            localStorage.removeItem("iptv_login");
            pararPlayers();
            location.reload();
        }

        function alternarModoVisao() {
            const grid = document.getElementById("items-grid");
            const btn = document.getElementById("btn-view-mode");
            if (modoVisao === "list") {
                modoVisao = "grid";
                grid.className = "view-grid";
                btn.innerText = "☰ Lista";
            } else {
                modoVisao = "list";
                grid.className = "view-list";
                btn.innerText = "⊞ Grade";
            }
        }

        function mudarAba(aba, btn) {
            abaAtual = aba;
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            const grid = document.getElementById("items-grid");
            const btnView = document.getElementById("btn-view-mode");
            if (aba === "live") {
                modoVisao = "list";
                grid.className = "view-list";
                btnView.innerText = "⊞ Grade";
            } else {
                modoVisao = "grid";
                grid.className = "view-grid";
                btnView.innerText = "☰ Lista";
            }

            carregarSecao(aba);
        }

        function abrirModalCategorias() {
            document.getElementById("cat-search-input").value = "";
            renderizarCategorias(listaCategorias);
            document.getElementById("category-modal").style.display = "flex";
        }

        function fecharModalCategorias() {
            document.getElementById("category-modal").style.display = "none";
        }

        async function carregarSecao(tipo) {
            const grid = document.getElementById("items-grid");
            document.getElementById("current-cat-name").innerText = "Todos os Grupos";
            categoriaSelecionadaId = "";
            indiceCategoriaAtual = -1;
            grid.innerHTML = "<p style='color:#a3a9c2; font-size:18px; padding:15px;'>Carregando grupos e canais...</p>";

            let catAction = tipo === "live" ? "get_live_categories" :
                            tipo === "vod" ? "get_vod_categories" : "get_series_categories";

            try {
                const urlCat = `${SERVER_DNS}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${catAction}`;
                const resp = await fetch(urlCat);
                listaCategorias = await resp.json();
                renderizarCategorias(listaCategorias);
                carregarItens("");
            } catch (e) {
                grid.innerHTML = "<p style='padding:15px; font-size:18px;'>Erro ao carregar grupos.</p>";
            }
        }

        function renderizarCategorias(categorias) {
            const catContainer = document.getElementById("categories-list");
            catContainer.innerHTML = "";

            // Botão Gigante "Todos os Grupos"
            const btnTodos = document.createElement("div");
            const isTodosAtivo = (categoriaSelecionadaId === "");
            btnTodos.className = "cat-item" + (isTodosAtivo ? " active" : "");
            btnTodos.innerHTML = `
                <div class="cat-item-left">
                    <span class="cat-item-num">ALL</span>
                    <span class="cat-item-title">Todos os Grupos</span>
                </div>
                <span class="cat-item-check">${isTodosAtivo ? "✓" : "›"}</span>
            `;
            btnTodos.onclick = () => selecionarCategoria("", "Todos os Grupos", -1);
            catContainer.appendChild(btnTodos);

            categorias.forEach((cat, idx) => {
                const div = document.createElement("div");
                const isAtivo = (categoriaSelecionadaId === cat.category_id);
                div.className = "cat-item" + (isAtivo ? " active" : "");
                div.innerHTML = `
                    <div class="cat-item-left">
                        <span class="cat-item-num">${idx + 1}</span>
                        <span class="cat-item-title">${cat.category_name}</span>
                    </div>
                    <span class="cat-item-check">${isAtivo ? "✓" : "›"}</span>
                `;
                const realIndex = listaCategorias.findIndex(c => c.category_id === cat.category_id);
                div.onclick = () => selecionarCategoria(cat.category_id, cat.category_name, realIndex);
                catContainer.appendChild(div);
            });
        }

        function filtrarCategorias() {
            const termo = document.getElementById("cat-search-input").value.toLowerCase();
            const filtradas = listaCategorias.filter(c => (c.category_name || "").toLowerCase().includes(termo));
            renderizarCategorias(filtradas);
        }

        function selecionarCategoria(catId, catNome, idx) {
            categoriaSelecionadaId = catId;
            indiceCategoriaAtual = idx;
            document.getElementById("current-cat-name").innerText = catNome;
            fecharModalCategorias();
            carregarItens(catId);
        }

        function navegarGrupo(direcao) {
            if (!listaCategorias || listaCategorias.length === 0) return;
            let novoIndice = indiceCategoriaAtual + direcao;

            if (novoIndice < -1) {
                novoIndice = listaCategorias.length - 1;
            } else if (novoIndice >= listaCategorias.length) {
                novoIndice = -1;
            }

            if (novoIndice === -1) {
                selecionarCategoria("", "Todos os Grupos", -1);
            } else {
                const cat = listaCategorias[novoIndice];
                selecionarCategoria(cat.category_id, cat.category_name, novoIndice);
            }
        }

        async function carregarItens(catId) {
            const grid = document.getElementById("items-grid");
            grid.innerHTML = "<p style='color:#a3a9c2; font-size:18px; padding:15px;'>Carregando lista...</p>";

            let streamAction = abaAtual === "live" ? "get_live_streams" :
                               abaAtual === "vod" ? "get_vod_streams" : "get_series";

            let url = `${SERVER_DNS}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${streamAction}`;
            if (catId) url += `&category_id=${catId}`;

            try {
                const resp = await fetch(url);
                listaAtual = await resp.json();
                renderizarGrid(listaAtual.slice(0, 400));
            } catch (e) {
                grid.innerHTML = "<p style='padding:15px; font-size:18px;'>Erro ao carregar conteúdos.</p>";
            }
        }

        function renderizarGrid(itens) {
            const grid = document.getElementById("items-grid");
            grid.innerHTML = "";

            if (!itens || itens.length === 0) {
                grid.innerHTML = "<p style='color:#a3a9c2; font-size:18px; padding:15px;'>Nenhum canal ou filme encontrado neste grupo.</p>";
                return;
            }

            itens.forEach(item => {
                const card = document.createElement("div");
                card.className = "item-card";
                const imgUrl = item.stream_icon || item.cover || "https://via.placeholder.com/120x90/090b10/ffffff?text=TV";
                
                card.innerHTML = `
                    <img src="${imgUrl}" loading="lazy" onerror="this.src='https://via.placeholder.com/120x90/090b10/ffffff?text=TV'">
                    <div class="title">${item.name || item.title}</div>
                    <div class="play-badge">▶</div>
                `;
                card.onclick = () => selecionarItem(item);
                grid.appendChild(card);
            });
        }

        function filtrarItens() {
            const termo = document.getElementById("search-input").value.toLowerCase();
            const filtrados = listaAtual.filter(i => (i.name || i.title || "").toLowerCase().includes(termo));
            renderizarGrid(filtrados.slice(0, 250));
        }

        async function selecionarItem(item) {
            ultimoItemTocando = item;
            if (abaAtual === "live") {
                const id = item.stream_id;
                const url = `${SERVER_DNS}/live/${credenciais.user}/${credenciais.pass}/${id}.${formatoLive}`;
                iniciarPlayer(url, item.name, formatoLive);
            } else if (abaAtual === "vod") {
                const ext = item.container_extension || "mp4";
                const url = `${SERVER_DNS}/movie/${credenciais.user}/${credenciais.pass}/${item.stream_id}.${ext}`;
                iniciarPlayer(url, item.name, ext);
            } else if (abaAtual === "series") {
                carregarEpisodiosSerie(item.series_id, item.name);
            }
        }

        async function carregarEpisodiosSerie(seriesId, nomeSerie) {
            const grid = document.getElementById("items-grid");
            grid.innerHTML = "<p style='color:#a3a9c2; font-size:18px; padding:15px;'>Carregando episódios...</p>";
            try {
                const url = `${SERVER_DNS}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=get_series_info&series_id=${seriesId}`;
                const resp = await fetch(url);
                const data = await resp.json();
                grid.innerHTML = "";

                const btnVoltar = document.createElement("button");
                btnVoltar.className = "btn-back-series";
                btnVoltar.innerText = "⬅ Voltar para a lista de Séries";
                btnVoltar.onclick = () => renderizarGrid(listaAtual.slice(0, 400));
                grid.appendChild(btnVoltar);

                if (!data.episodes) {
                    grid.innerHTML += "<p style='padding:15px; font-size:18px;'>Nenhum episódio disponível.</p>";
                    return;
                }

                Object.keys(data.episodes).forEach(temp => {
                    data.episodes[temp].forEach(ep => {
                        const card = document.createElement("div");
                        card.className = "item-card";
                        card.innerHTML = `
                            <div class="title" style="font-weight:bold; color:#e50914;">T${temp} • Ep ${ep.episode_num}</div>
                            <div class="title">${ep.title || nomeSerie}</div>
                            <div class="play-badge">▶</div>
                        `;
                        card.onclick = () => {
                            const ext = ep.container_extension || "mp4";
                            const epUrl = `${SERVER_DNS}/series/${credenciais.user}/${credenciais.pass}/${ep.id}.${ext}`;
                            iniciarPlayer(epUrl, `${nomeSerie} - T${temp}E${ep.episode_num}`, ext);
                        };
                        grid.appendChild(card);
                    });
                });
            } catch (e) {
                grid.innerHTML = "<p style='padding:15px; font-size:18px;'>Erro ao carregar episódios.</p>";
            }
        }

        function pararPlayers() {
            const video = document.getElementById("video-player");
            video.pause();
            video.removeAttribute("src");
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
        }

        function iniciarPlayer(url, titulo, formato) {
            pararPlayers();
            urlAtual = url;
            document.getElementById("player-wrapper").style.display = "flex";
            document.getElementById("now-playing").innerText = titulo;
            const video = document.getElementById("video-player");

            if (formato === "ts" && mpegts.getFeatureList().mseLivePlayback) {
                mpegtsInstance = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: url });
                mpegtsInstance.attachMediaElement(video);
                mpegtsInstance.load();
                mpegtsInstance.play();
            } else if (formato === "m3u8" && Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        function alternarFormatoLive() {
            formatoLive = (formatoLive === "ts") ? "m3u8" : "ts";
            document.getElementById("btn-format").innerText = formatoLive.toUpperCase();
            if (ultimoItemTocando && abaAtual === "live") {
                selecionarItem(ultimoItemTocando);
            }
        }

        function abrirPlayerExterno() {
            if (!urlAtual) return;
            window.location.href = `intent:${urlAtual}#Intent;type=video/*;end`;
        }

        function fecharPlayer() {
            pararPlayers();
            document.getElementById("player-wrapper").style.display = "none";
        }
    </script>
</body>
</html>
